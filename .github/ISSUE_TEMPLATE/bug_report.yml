name: Bug report / Сообщить об ошибке
description: Describe a reproducible FloatingDock problem.
title: "[Bug]: "
labels: []
body:
  - type: input
    id: version
    attributes:
      label: FloatingDock version / Версия
      placeholder: "1.5.0 — Setup or Portable"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and displays / Windows и мониторы
      description: Windows version, monitor count and display scaling.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Как повторить
      description: Include the affected app and whether tiling is enabled.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / Ожидание и результат
    validations:
      required: true
