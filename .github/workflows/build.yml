name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The engine is Rust (rust/); the interface is Flutter (ui_flutter/). A release is assembled with packaging/release-rust.ps1
# (it needs a finished build of the interface) and published by hand, so this workflow only checks the engine.
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Select-String -Path rust/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag and workspace version differ.' }
      - name: Test the engine
        working-directory: rust
        shell: pwsh
        run: cargo test --workspace --locked
      - name: Build the engine
        working-directory: rust
        shell: pwsh
        run: cargo build --release --locked -p fd-engine
      - uses: actions/upload-artifact@v4
        with:
          name: fd-engine-win-x64
          path: rust/target/release/fd-engine.exe
          if-no-files-found: error
